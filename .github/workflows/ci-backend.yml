name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/parkinghub_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cai dependency
        run: uv sync --frozen
      - name: Chay test
        run: uv run --frozen pytest test -q
