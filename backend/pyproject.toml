[project]
name = "washmind-backend"
version = "0.1.0"
description = "WashMind — Intelligent dispatch system for car wash network"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Database
    "motor>=3.6.0",
    "umongo>=3.1.0",
    "pymongo>=4.9.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "passlib[bcrypt]>=1.7.4",

    # Utilities
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
