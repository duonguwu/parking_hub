name: parkinghub-infra

# ─────────────────────────────────────────────────────────────────────────────
# ParkingHub Infrastructure Stack — MongoDB + Redis
#
# Chạy TRƯỚC docker-compose.prod.yml (app phụ thuộc vào đây)
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml down      # KHÔNG xóa volume
#   docker compose -f docker-compose.infra.yml down -v   # xóa cả volume (reset data!)
#
# Ports (chỉ bind 127.0.0.1 — KHÔNG lộ ra Internet):
#   MongoDB → 127.0.0.1:27017
#   Redis   → 127.0.0.1:6379
#
# Server nhỏ (2 vCPU / 4GB) → giới hạn RAM/CPU để không tranh chấp với API.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ───────────────────────────────────────────────────────────────────────────
  # MongoDB 7.0 — primary database
  #   wiredTigerCacheSizeGB 0.5 → mặc định Mongo lấy ~50% RAM, quá nhiều cho VPS 4GB
  # ───────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: parkinghub-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # Redis 7.2 — distributed lock (booking slot) + cache (OSM route, weather)
  #
  # Idle: ~5MB RAM, ~0% CPU.
  # Policy: volatile-lru — chỉ evict key CÓ TTL (cache), KHÔNG đụng lock.
  # AOF everysec: dữ liệu sống qua restart, chi phí không đáng kể ở tải nhỏ.
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: parkinghub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --save ""
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

# ─────────────────────────────────────────────────────────────────────────────
# Volumes (có tên cố định — đổi tên project cũng không mất data)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: parkinghub-mongo-data
  redis_data:
    name: parkinghub-redis-data
